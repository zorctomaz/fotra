<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOTRA :: AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  :root{
    --dos-blue: #0000AA;
    --dos-blue-dark: #000077;
    --cyan: #55FFFF;
    --cyan-dim: #00AAAA;
    --white: #FFFFFF;
    --yellow: #FFFF55;
    --grey: #AAAAAA;
    --black: #000000;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    background: var(--dos-blue);
    color: var(--white);
    font-family: 'VT323', monospace;
  }

  body{
    min-height:100svh;
    display:flex;
    justify-content:center;
    padding: clamp(0.6rem, 3vw, 1.6rem);
  }

  /* CRT scanlines */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 5;
  }

  .screen{
    width:100%;
    max-width: 760px;
    border: 6px double var(--cyan);
    background: var(--dos-blue);
    padding: clamp(1rem, 4vw, 1.8rem) clamp(1.2rem, 4vw, 2.2rem) clamp(1.4rem, 4vw, 2rem);
  }

  .titlebar{
    text-align:center;
    border-bottom: 2px solid var(--cyan-dim);
    padding-bottom: 0.9rem;
    margin-bottom: 1.3rem;
    position:relative;
  }

  .lang-toggle{
    position:absolute;
    top: 0;
    right: 0;
    display:flex;
    border: 2px solid var(--cyan);
  }

  .lang-btn{
    font-family:'VT323', monospace;
    background: var(--dos-blue);
    color: var(--cyan);
    border: none;
    padding: 0.2rem 0.6rem;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    cursor:pointer;
    letter-spacing: 0.05em;
  }

  .lang-btn + .lang-btn{ border-left: 2px solid var(--cyan); }

  .lang-btn.active{
    background: var(--cyan);
    color: var(--black);
  }

  .back-link{
    position:absolute;
    top:0;
    left:0;
    color: var(--yellow);
    text-decoration:none;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    letter-spacing:0.05em;
  }

  .back-link:hover, .back-link:focus-visible{ color: var(--white); }

  .ascii-title{
    font-size: clamp(2.2rem, 9vw, 3.2rem);
    line-height:1;
    letter-spacing: 0.12em;
    color: var(--yellow);
    text-shadow: 0 0 6px rgba(255,255,85,0.5);
    margin: 0 0 0.35rem;
  }

  .sub{
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: var(--cyan);
    letter-spacing: 0.08em;
    margin:0;
  }

  .body-text{
    font-size: clamp(1.05rem, 3.2vw, 1.3rem);
    line-height: 1.5;
    color: var(--white);
    margin: 0 0 1rem;
  }

  .body-text .blink{
    color: var(--yellow);
  }

  .statusbar{
    margin-top: 1.3rem;
    padding-top: 0.9rem;
    border-top: 2px solid var(--cyan-dim);
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: var(--grey);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap: 0.4rem;
  }

  .prompt{ color: var(--white); }

  .cursor{
    display:inline-block;
    width: 0.55em;
    background: var(--white);
    animation: blink 1s steps(1) infinite;
    margin-left: 2px;
  }

  .cursor::after{ content:"\00a0"; }

  @keyframes blink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; }
  }
</style>
</head>
<body>

  <div class="screen">
    <div class="titlebar">
      <a class="back-link" href="../" data-sl="[ESC]" data-en="[ESC]">[ESC]</a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="sl">SI</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
      <p class="ascii-title">AI</p>
      <p class="sub" data-sl="V PRIPRAVI" data-en="UNDER CONSTRUCTION">V PRIPRAVI</p>
    </div>

    <p class="body-text" data-sl="Ta razdelek je še v gradnji. Kmalu bo tu na voljo vsebina, povezana z umetno inteligenco." data-en="This section is still under construction. AI-related content will be available here soon.">Ta razdelek je še v gradnji. Kmalu bo tu na voljo vsebina, povezana z umetno inteligenco.</p>

    <div class="statusbar">
      <span class="prompt">C:\FOTRA\AI&gt;<span class="cursor"></span></span>
      <span data-sl="ESC=NAZAJ" data-en="ESC=BACK">ESC=NAZAJ</span>
    </div>
  </div>

<script>
  function setLang(lang){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-sl][data-en]').forEach(function(el){
      el.textContent = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-sl');
    });
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ setLang(btn.getAttribute('data-lang')); });
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      window.location.href = '../';
    }
  });
</script>

</body>
</html>
