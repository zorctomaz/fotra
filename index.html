<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<script>
  // Canonical-host redirect: send www.fotra.net -> fotra.net immediately,
  // as a safety net in case GitHub Pages' own www->apex redirect hasn't
  // kicked in yet. Runs before anything else loads.
  if(location.hostname === 'www.fotra.net'){
    location.replace('https://fotra.net' + location.pathname + location.search + location.hash);
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>FOTRA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  :root{
    --dos-blue: #0000AA;
    --dos-blue-dark: #000077;
    --cyan: #55FFFF;
    --cyan-dim: #00AAAA;
    --white: #FFFFFF;
    --yellow: #FFFF55;
    --grey: #AAAAAA;
    --black: #000000;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    overflow-x:hidden;
    background: var(--dos-blue);
    color: var(--white);
    font-family: 'VT323', monospace;
  }

  body{
    height:100svh;
    width:100vw;
    display:flex;
    align-items:stretch;
    justify-content:stretch;
    padding:0;
    position:relative;
  }

  /* CRT scanlines */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 5;
  }

  /* subtle vignette flicker */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.35) 100%);
    z-index: 4;
    animation: flicker 6s infinite steps(30);
  }

  @keyframes flicker{
    0%,100%{ opacity:1; }
    50%{ opacity:0.97; }
  }

  @media (prefers-reduced-motion: reduce){
    body::after{ animation:none; }
  }

  .screen{
    width:100%;
    height:100%;
    max-width:none;
    border: 6px double var(--cyan);
    background: var(--dos-blue);
    padding: clamp(1rem, 4vw, 1.8rem) clamp(1.2rem, 4vw, 2.2rem) clamp(1.4rem, 4vw, 2rem);
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow-y:auto;
  }

  .screen[hidden]{
    display:none;
  }

  .screen > *{
    width:100%;
    max-width: 640px;
    margin-left:auto;
    margin-right:auto;
  }

  .titlebar{
    text-align:center;
    border-bottom: 2px solid var(--cyan-dim);
    padding-bottom: 0.9rem;
    margin-bottom: 1.1rem;
    position:relative;
  }

  .titlebar-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top: 0.9rem;
  }

  .lang-toggle{
    display:flex;
  }

  .lang-btn{
    font-family:'VT323', monospace;
    background: var(--dos-blue);
    color: var(--cyan);
    border: none;
    padding: 0.2rem 0.6rem;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    cursor:pointer;
    letter-spacing: 0.05em;
  }

  /* Only the language you can switch TO is shown — the current one stays
     in the DOM (for the click handler / a11y) but hidden. */
  .lang-btn.active{
    display:none;
  }

  .ascii-title{
    font-size: clamp(2.6rem, 11vw, 4.2rem);
    line-height:1;
    letter-spacing: 0.12em;
    color: var(--yellow);
    text-shadow: 0 0 6px rgba(255,255,85,0.5);
    margin: 0 0 0.35rem;
  }

  .sub{
    font-size: clamp(1.05rem, 3.2vw, 1.3rem);
    color: var(--cyan);
    letter-spacing: 0.08em;
    margin:0;
  }

  .sub .sep{ color: var(--grey); margin: 0 0.4em; }

  nav.menu{
    display:flex;
    flex-direction:column;
    gap: 0.5rem;
  }

  a.item, button.item{
    display:flex;
    align-items:center;
    gap: 0.9rem;
    text-decoration:none;
    color: var(--white);
    padding: 0.55rem 0.7rem;
    border: 2px solid transparent;
    font-size: clamp(1.2rem, 4vw, 1.5rem);
    letter-spacing: 0.04em;
    background:none;
    font-family:'VT323', monospace;
    width:100%;
    text-align:left;
    cursor:pointer;
  }

  a.item .key,
  button.item .key{
    color: var(--yellow);
    font-weight:normal;
  }

  a.item .sprite-wrap,
  button.item .sprite-wrap{
    width: clamp(30px, 8vw, 40px);
    height: clamp(30px, 8vw, 40px);
    flex-shrink:0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  a.item .sprite-wrap svg,
  button.item .sprite-wrap svg{
    width:100%;
    height:100%;
    display:block;
    shape-rendering: crispEdges;
  }

  a.item:hover,
  a.item:focus-visible,
  a.item.keyed,
  button.item:hover,
  button.item:focus-visible,
  button.item.keyed{
    background: var(--cyan);
    color: var(--black);
    border-color: var(--white);
    outline: none;
  }

  a.item:hover .key,
  a.item:focus-visible .key,
  a.item.keyed .key,
  button.item:hover .key,
  button.item:focus-visible .key,
  button.item.keyed .key{
    color: var(--dos-blue-dark);
  }

  .terminal{
    margin-top: 1.3rem;
    padding-top: 0.9rem;
    border-top: 2px solid var(--cyan-dim);
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: var(--grey);
  }

  .statusbar{
    margin-top: 1.3rem;
    padding-top: 0.9rem;
    border-top: 2px solid var(--cyan-dim);
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: var(--grey);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap: 0.4rem;
  }

  .prompt{
    color: var(--white);
    flex: none;
  }

  .foot-email{
    display:block;
    color: var(--grey);
    text-decoration:none;
    letter-spacing:.03em;
    margin-bottom:.7rem;
    transition: color .15s ease;
  }
  .foot-email:hover, .foot-email:focus-visible{ color: var(--yellow); }

  .term-log{
    display:flex;
    flex-direction:column;
    gap: 2px;
    max-height: 7.4em;
    overflow-y: auto;
    margin-bottom: 0.5rem;
  }

  .term-log div{
    white-space: pre-wrap;
    word-break: break-word;
  }

  .term-line{
    display:flex;
    align-items:center;
    gap: 0.5rem;
    cursor: text;
  }

  .term-input{
    flex:1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    color: var(--white);
    font-family: 'VT323', monospace;
    font-size: inherit;
    caret-color: var(--white);
  }

  .term-input::placeholder{
    color: var(--grey);
    opacity: 0.85;
  }
</style>
</head>
<body>

  <div class="screen">
    <div class="titlebar">
      <p class="ascii-title">FOTRA</p>
      <p class="sub"><span data-sl="AI" data-en="AI">AI</span><span class="sep">·</span><span data-sl="NORVEŠKA" data-en="NORWAY">NORVEŠKA</span><span class="sep">·</span><span data-sl="JADRANJE" data-en="SAILING">JADRANJE</span><span class="sep">·</span><span data-sl="VIDEO" data-en="VIDEO">VIDEO</span><span class="sep">·</span><span data-sl="FOTO" data-en="PHOTO">FOTO</span></p>
      <div class="titlebar-controls">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="sl">SI</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </div>

    <nav class="menu">
      <a class="item" href="https://ai.fotra.net">
        <span class="sprite-wrap"><svg id="spr-ai" viewBox="0 0 12 12"></svg></span>
        <span><span class="key" data-sl="[A]" data-en="[A]">[A]</span> <span data-sl="AI" data-en="AI">AI</span></span>
      </a>
      <a class="item" href="https://norway.fotra.net">
        <span class="sprite-wrap"><svg id="spr-norway" viewBox="0 0 12 12"></svg></span>
        <span><span class="key" data-sl="[N]" data-en="[N]">[N]</span> <span data-sl="NORVEŠKA" data-en="NORWAY">NORVEŠKA</span></span>
      </a>
      <a class="item" href="https://jadranje.fotra.net">
        <span class="sprite-wrap">
          <!-- jadranje.fotra.net's own favicon artwork, not a pixel sprite -->
          <svg viewBox="0 0 24 24" style="shape-rendering:auto;"><rect width="24" height="24" fill="#0000AA"/><path d="M12 3v10M12 4l5.5 8H12M4 17h16l-2.5 4h-11z" fill="none" stroke="#FFFF55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span><span class="key" data-sl="[J]" data-en="[S]">[J]</span> <span data-sl="JADRANJE" data-en="SAILING">JADRANJE</span></span>
      </a>
      <a class="item" href="https://video.fotra.net">
        <span class="sprite-wrap"><svg id="spr-video" viewBox="0 0 12 12"></svg></span>
        <span><span class="key" data-sl="[V]" data-en="[V]">[V]</span> <span data-sl="VIDEO" data-en="VIDEO">VIDEO</span></span>
      </a>
      <a class="item" href="https://www.instagram.com/dart__ejder/">
        <span class="sprite-wrap"><svg id="spr-camera" viewBox="0 0 12 12"></svg></span>
        <span><span class="key" data-sl="[F]" data-en="[P]">[F]</span> <span data-sl="FOTO" data-en="PHOTO">FOTO</span></span>
      </a>
      <a class="item" href="games.html">
        <span class="sprite-wrap">
          <!-- generic game-controller icon, not a pixel sprite -->
          <svg viewBox="0 0 24 24" style="shape-rendering:auto;" fill="none" stroke="#55FFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="10" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="12" r="1" fill="#55FFFF"/><circle cx="19" cy="14" r="1" fill="#55FFFF"/></svg>
        </span>
        <span><span class="key" data-sl="[I]" data-en="[G]">[I]</span> <span data-sl="IGRE" data-en="GAMES">IGRE</span></span>
      </a>
    </nav>

    <div class="terminal" id="terminal">
      <a class="foot-email" href="mailto:info@fotra.net">info@fotra.net</a>
      <div class="term-log" id="termLog" aria-live="polite"></div>
      <div class="term-line">
        <label for="termInput" class="prompt">C:\FOTRA&gt;</label>
        <input type="text" id="termInput" class="term-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command input" placeholder="vnesi ukaz (HELP)" data-sl-ph="vnesi ukaz (HELP)" data-en-ph="type a command (HELP)">
      </div>
    </div>
  </div>

<script>
  function drawSprite(id, grid, palette){
    var svg = document.getElementById(id);
    if(!svg) return;
    var frag = document.createDocumentFragment();
    for(var y = 0; y < grid.length; y++){
      var row = grid[y];
      for(var x = 0; x < row.length; x++){
        var ch = row[x];
        if(ch !== '.'){
          var rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
          rect.setAttribute('x', x);
          rect.setAttribute('y', y);
          rect.setAttribute('width', 1.02);
          rect.setAttribute('height', 1.02);
          rect.setAttribute('fill', palette[ch]);
          frag.appendChild(rect);
        }
      }
    }
    svg.appendChild(frag);
  }

  var norwayFlagGrid = [
    "RRRWBWRRRRRR",
    "RRRWBWRRRRRR",
    "RRRWBWRRRRRR",
    "RRRWBWRRRRRR",
    "RRRWBWRRRRRR",
    "WWWWBWWWWWWW",
    "BBBBBBBBBBBB",
    "WWWWBWWWWWWW",
    "RRRWBWRRRRRR",
    "RRRWBWRRRRRR",
    "RRRWBWRRRRRR",
    "RRRWBWRRRRRR"
  ];
  var norwayFlagPalette = { R:"#BA0C2F", W:"#FFFFFF", B:"#00205B" };

  var aiGrid = [
    "............",
    ".K........K.",
    "KKCCCCCCCCKK",
    "K.CWWWWWWC.K",
    "K.CWKKKKWC.K",
    "K.CWKYYKWC.K",
    "K.CWKYYKWC.K",
    "K.CWKKKKWC.K",
    "K.CWWWWWWC.K",
    "KKCCCCCCCCKK",
    ".K........K.",
    "............"
  ];
  var aiPalette = { K:"#000000", C:"#00AAAA", W:"#FFFFFF", Y:"#FFFF55" };

  var videoGrid = [
    "............",
    ".KKKKKKKK...",
    ".KWWWWWWK...",
    ".KWCCCCWK.KK",
    ".KWCCCCWKKRK",
    ".KWWWWWWK.KK",
    ".KKKKKKKK...",
    "............",
    "....RR......",
    "....RR......",
    "............",
    "............"
  ];
  var videoPalette = { K:"#000000", W:"#FFFFFF", C:"#00AAAA", R:"#FF5555" };

  var cameraGrid = [
    "............",
    "..KK....KK..",
    ".KKKKKKKKKK.",
    "KKKKKKKKKKKK",
    "KKKWWWWWWKKK",
    "KKWWCCCCWWKK",
    "KKWWCCCCWWKK",
    "KKKWWWWWWKKK",
    "KKKKKKKKKKKK",
    "............",
    "..Y......Y..",
    "............"
  ];
  var cameraPalette = { K:"#000000", W:"#FFFFFF", C:"#55FFFF", Y:"#FFFF55" };

  drawSprite('spr-norway', norwayFlagGrid, norwayFlagPalette);
  drawSprite('spr-ai', aiGrid, aiPalette);
  drawSprite('spr-video', videoGrid, videoPalette);
  drawSprite('spr-camera', cameraGrid, cameraPalette);

  // ----- Language toggle -----
  // A subpage (ai/norway/jadranje/video.fotra.net) that had its language
  // switched appends ?lang= to its link back here, so a returning visitor's
  // choice carries over even though localStorage isn't shared across those
  // different origins. ?lang= takes priority over this site's own stored
  // preference, matching the same urlLang > storedLang pattern the subpages use.
  var currentLang = 'sl';
  try{
    var storedLang = localStorage.getItem('fotraLang');
    if(storedLang === 'en' || storedLang === 'sl'){ currentLang = storedLang; }
    var urlLang = new URLSearchParams(window.location.search).get('lang');
    if(urlLang === 'en' || urlLang === 'sl'){ currentLang = urlLang; }
  }catch(e){}

  function setLang(lang){
    currentLang = lang;
    document.documentElement.lang = lang;

    document.querySelectorAll('[data-sl][data-en]').forEach(function(el){
      el.textContent = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-sl');
    });

    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });

    var termInputEl = document.getElementById('termInput');
    if(termInputEl){
      termInputEl.placeholder = termInputEl.getAttribute(lang === 'en' ? 'data-en-ph' : 'data-sl-ph');
    }

    try{ localStorage.setItem('fotraLang', lang); }catch(e){}

    // Keep the address bar's ?lang= in sync so the current language survives
    // a refresh, bookmark or share — without adding a back-button entry.
    try{
      var selfUrl = new URL(window.location.href);
      selfUrl.searchParams.set('lang', lang);
      history.replaceState(history.state, '', selfUrl);
    }catch(e){}

    // norway.fotra.net, ai.fotra.net, jadranje.fotra.net and video.fotra.net
    // each read ?lang= on load, so carry the current language across to
    // those different-origin sites too (their own localStorage isn't
    // shared with this one).
    var langLinkedOrigins = {
      norway: 'https://norway.fotra.net',
      ai: 'https://ai.fotra.net',
      jadranje: 'https://jadranje.fotra.net',
      video: 'https://video.fotra.net'
    };
    Object.keys(langLinkedOrigins).forEach(function(id){
      var origin = langLinkedOrigins[id];
      var el = document.querySelector('a.item[href^="' + origin + '"]');
      if(el){
        var href = origin + '?lang=' + lang;
        el.href = href;
        targets[id] = href;
      }
    });
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      setLang(btn.getAttribute('data-lang'));
    });
  });

  // ----- Keyboard shortcuts: press a letter to jump straight to that page -----
  // Targets are keyed by a language-independent id; which single key fires
  // each one changes with the language, so it always matches the bracketed
  // hint the visitor is actually looking at ([S] SAILING, not [J] SAILING).
  var targets = {
    ai: 'https://ai.fotra.net',
    norway: 'https://norway.fotra.net',
    jadranje: 'https://jadranje.fotra.net',
    video: 'https://video.fotra.net',
    foto: 'https://www.instagram.com/dart__ejder/',
    games: 'games.html'
  };
  var keysByLang = {
    sl: { A:'ai', N:'norway', J:'jadranje', V:'video', F:'foto', I:'games' },
    en: { A:'ai', N:'norway', S:'jadranje', V:'video', P:'foto', G:'games' }
  };

  // ----- Terminal-style command input (C:\FOTRA>), CMD-like -----
  var termLog = document.getElementById('termLog');
  var termInput = document.getElementById('termInput');

  var termHelp = {
    sl: ['Ukazi: J=JADRANJE  N=NORVEŠKA  A=AI  V=VIDEO  F=FOTO  G=IGRE', 'DIR = izpiši meni    CLS = počisti zaslon    HELP = ta pomoč'],
    en: ['Commands: J=SAILING  N=NORWAY  A=AI  V=VIDEO  F=PHOTO  G=GAMES', 'DIR = list menu    CLS = clear screen    HELP = this help']
  };

  var termDir = {
    sl: [' A   AI          -> ai.fotra.net', ' N   NORVESKA    -> norway.fotra.net', ' J   JADRANJE    -> jadranje.fotra.net', ' V   VIDEO       -> video.fotra.net', ' F   FOTO        -> instagram', ' I   IGRE        -> games.html'],
    en: [' A   AI          -> ai.fotra.net', ' N   NORWAY      -> norway.fotra.net', ' S   SAILING     -> jadranje.fotra.net', ' V   VIDEO       -> video.fotra.net', ' P   PHOTO       -> instagram', ' G   GAMES       -> games.html']
  };

  var termUnknown = {
    sl: function(c){ return ["'" + c + "' ni prepoznan kot notranji ali zunanji ukaz,", 'izvedljiv program ali paketna datoteka.']; },
    en: function(c){ return ["'" + c + "' is not recognized as an internal or external command,", 'operable program or batch file.']; }
  };

  // Language-independent: any synonym in either language, or either
  // language's single-letter hint, routes to the same canonical target.
  var termAliases = {
    A:'ai', AI:'ai',
    N:'norway', NORVESKA:'norway', NORWAY:'norway',
    J:'jadranje', S:'jadranje', JADRANJE:'jadranje', SAIL:'jadranje', SAILING:'jadranje',
    V:'video', VIDEO:'video',
    F:'foto', P:'foto', FOTO:'foto', PHOTO:'foto',
    I:'games', G:'games', GAMES:'games', IGRE:'games', IGRA:'games', GAME:'games',
    X:'games', SNAKE:'games', KACA:'games', SUDOKU:'games'
  };

  function termPrint(lines){
    lines.forEach(function(line){
      var row = document.createElement('div');
      row.textContent = line;
      termLog.appendChild(row);
    });
    termLog.scrollTop = termLog.scrollHeight;
  }

  function termRunCommand(raw){
    var cmd = raw.trim();
    if(!cmd) return;
    termPrint(['C:\\FOTRA>' + cmd]);

    var norm = cmd.toUpperCase().replace(/Š/g,'S').replace(/Č/g,'C').replace(/Ž/g,'Z');

    var routeId = termAliases[norm];
    if(routeId && targets[routeId]){
      termPrint([currentLang === 'sl' ? 'Odpiram ...' : 'Opening ...']);
      window.setTimeout(function(){ window.location.href = targets[routeId]; }, 200);
      return;
    }

    if(norm === 'HELP' || norm === '?' || norm === 'POMOC'){
      termPrint(termHelp[currentLang]);
      return;
    }

    if(norm === 'DIR' || norm === 'LS'){
      termPrint(termDir[currentLang]);
      return;
    }

    if(norm === 'CLS' || norm === 'CLEAR'){
      termLog.innerHTML = '';
      return;
    }

    if(norm === 'VER'){
      termPrint(['FOTRA.EXE [Version 1.0]']);
      return;
    }

    if(norm.indexOf('ECHO ') === 0){
      termPrint([cmd.slice(5)]);
      return;
    }

    termPrint(termUnknown[currentLang](cmd));
  }

  termInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      termRunCommand(termInput.value);
      termInput.value = '';
    }
  });

  document.getElementById('terminal').addEventListener('click', function(){
    termInput.focus();
  });

  termPrint([currentLang === 'sl' ? 'Vtipkaj HELP za seznam ukazov.' : 'Type HELP for a list of commands.']);

  document.addEventListener('keydown', function(e){
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')){
      return;
    }

    var key = e.key.toUpperCase();

    var routeId = keysByLang[currentLang][key];
    var href = routeId && targets[routeId];
    if(!href) return;

    var link = document.querySelector('a.item[href="' + href + '"]');
    if(!link) return;

    e.preventDefault();
    link.classList.add('keyed');
    link.focus({ preventScroll: true });

    window.setTimeout(function(){
      window.location.href = href;
    }, 160);
  });

  // Apply the language restored from localStorage (or the sl default)
  // now that every element it touches (shortcuts, termInput) exists.
  setLang(currentLang);

</script>

</body>
</html>
